name: Deploy to production server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/github-action
          chmod 400 ~/.ssh/github-action
          printf 'Host vps\n\tUser root\n\tHostname marticongost.cat\n\tIdentityFile ~/.ssh/github-action\n\tStrictHostKeyChecking accept-new\n' > ~/.ssh/config
      - name: Deploy static files
        run: |
          rsync -re ssh --delete ./build/ vps:/var/www/the-kings-council/
          ssh vps "chown -R www-data:www-data /var/www/the-kings-council"
